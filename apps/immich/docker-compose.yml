services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    volumes:
      - ${IMMICH_ROOT}:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-database:
        condition: service_healthy
    environment:
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DBINDEX: ${REDIS_DBINDEX}
      TZ: ${TZ}
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - immich-model-cache:/cache
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:latest
    volumes:
      - immich-redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    volumes:
      - immich-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    shm_size: 128mb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  immich-public-proxy:
    image: alangrainger/immich-public-proxy:latest
    container_name: immich-public-proxy
    restart: always
    ports:
      - "${IPP_PORT:-2284}:2284"
    environment:
      PUBLIC_BASE_URL: ${PUB_BASE_URL}
      IMMICH_URL: ${IMMICH_URL}
      IPP_PORT: ${IPP_PORT:-2284}
    healthcheck:
      test: curl -s http://localhost:${IPP_PORT:-2284}/share/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s
volumes:
  immich-model-cache:
  immich-postgres:
  immich-redis-data:

